<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型对比 · 视频质量评估</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="index.html" style="color:inherit">视频生成 Agent × 质量评估</a></h1>
    <nav><a href="index.html">总览</a><a href="method.html">评估方法</a></nav>
  </header>
  <div id="main"></div>
</div>
<script src="assets/app.js"></script>
<script src="assets/timeline.js"></script>
<script>
loadData().then(data => {
  const pid = q('pid');
  const p = data.prompts.find(x => x.id === pid);
  const main = document.getElementById('main');
  if (!p) { main.textContent = '未找到该 prompt'; return; }
  document.title = `${p.title_zh || p.id} · 模型对比`;
  // 只对比该 case 实际有产物/评估的模型
  const models = data.models.filter(mk => p.films[mk] || p.evals[mk]);
  const head = el('div', 'card');
  const h = el('h2', '', `${p.id} ${p.title_zh || ''} · ` +
    models.map(mk => data.model_info[mk].label).join(' vs '));
  h.style.margin = '0 0 6px'; head.appendChild(h);
  head.appendChild(el('div', 'sub', `创意：${p.idea}`));
  main.appendChild(head);

  const g = el('div', `grid ${models.length >= 3 ? 'cols3' : 'cols2'}`);
  g.style.marginTop = '16px';
  models.forEach(mk => {
    const e = p.evals[mk];
    const c = el('div', 'card');
    const t = el('h3', '', data.model_info[mk].label); t.style.marginTop = '0';
    c.appendChild(t);
    const video = el('video', 'player');
    video.controls = true; video.src = videoSrc(pid, mk, 'film.mp4');
    c.appendChild(video);
    if (e) {
      const row = el('div', 'kv');
      const b = el('span'); b.style.cssText = 'border:none;padding:0';
      b.appendChild(scoreBadge(e.scores.total)); row.appendChild(b);
      Object.entries(e.scores.per_dim).forEach(([k, v]) => {
        const zh = { temporal: '时序', structural: '结构', subject: '主体', semantic: '语义' }[k] || k;
        row.appendChild(el('span', '', `${zh} ${v}`));
      });
      row.appendChild(el('span', '', `评估 ${fmtS(e.timing.total_s)}`));
      c.appendChild(row);
      const tl = el('div'); tl.style.marginTop = '12px';
      c.appendChild(tl); drawTimeline(tl, e, video);
      c.appendChild(el('h3', '', `缺陷（${e.findings.length}）`));
      c.appendChild(findingsTable(e.findings, s => { video.currentTime = s; video.play().catch(() => {}); }));
      const t10 = el('div', 'note');
      t10.style.marginTop = '10px';
      t10.textContent = 'T10 对齐: ' + (e.t10_alignment || []).map(x => `shot${x.shot_id}=${x.score}/5`).join(' · ');
      c.appendChild(t10);
    } else c.appendChild(el('div', 'note', '尚未评估'));
    const dl = el('a', '', '→ 查看详情');
    dl.href = `detail.html?pid=${pid}&model=${mk}`;
    dl.style.cssText = 'display:inline-block;margin-top:10px';
    c.appendChild(dl);
    g.appendChild(c);
  });
  main.appendChild(g);

  // 结论区：所有已评估模型横向对比
  const evaled = models.filter(mk => p.evals[mk]);
  if (evaled.length >= 2) {
    const cc = el('div', 'card'); cc.style.marginTop = '16px';
    cc.appendChild(el('h3', '', '同 prompt 对比'));
    const tb = el('table');
    const th = el('tr');
    ['指标', ...evaled.map(mk => data.model_info[mk].label)]
      .forEach(x => th.appendChild(el('th', '', x)));
    tb.appendChild(th);
    const rows = [
      ['总分', e => e.scores.total],
      ['缺陷数', e => e.findings.length],
      ['硬失败', e => e.scores.hard_fails.join(',') || '无'],
      ['语义对齐均分', e => avg(e.t10_alignment)],
      ['评估耗时', e => fmtS(e.timing.total_s)],
    ];
    rows.forEach(([k, fn]) => {
      const tr = el('tr');
      tr.appendChild(el('td', '', k));
      evaled.forEach(mk => tr.appendChild(el('td', 'num', String(fn(p.evals[mk])))));
      tb.appendChild(tr);
    });
    cc.appendChild(tb);
    main.appendChild(cc);
  }
  function avg(t) {
    const s = (t || []).map(x => x.score).filter(Boolean);
    return s.length ? (s.reduce((a, b) => a + b, 0) / s.length).toFixed(1) + '/5' : '—';
  }
});
</script>
</body>
</html>
